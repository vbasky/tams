[package]
name = "tams"
version = "0.1.0"
edition = "2021"
description = "Rust implementation of the Time-Addressable Media Store (TAMS) API specification"
license = "Apache-2.0"
repository = "https://github.com/vbasky/tams"
readme = "README.md"
keywords = ["tams", "media", "broadcast", "timeline", "api"]
categories = ["multimedia", "api-bindings", "network-programming"]
authors = ["Vikram Bhaskaran"]

[dependencies]
# Core async runtime
tokio = { version = "1", features = ["full"] }
# HTTP client/server
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
axum = { version = "0.7", features = ["json"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# UUID and time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# Error handling
thiserror = "1"
anyhow = "1"
# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
