[workspace]
resolver = "2"
members = [
    "crates/tams",
    "crates/tams-core",
    "crates/tams-client",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/vbasky/tams"
authors = ["Vikram Bhaskaran"]
rust-version = "1.75"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
